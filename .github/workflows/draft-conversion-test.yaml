# Temporary: tests whether an Octo-STS token can convert a pull request to
# draft, comparing token scopes and fork versus branch pull requests.
# Remove together with .github/chainguard/draft-test-*.sts.yaml.
name: Draft conversion test

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to convert to draft
        required: true
        type: number
      identity:
        description: Octo-STS trust policy to use
        required: true
        type: choice
        options:
          - draft-test-pr
          - draft-test-pr-issues

permissions: {}

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Octo-STS OIDC exchange
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Get Octo-STS token
        id: sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: ${{ github.repository }}
          identity: ${{ inputs.identity }}

      - name: Convert to draft
        env:
          GH_TOKEN: ${{ steps.sts.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          IDENTITY: ${{ inputs.identity }}
        run: |
          before=$(gh pr view "$PR" --json isDraft,isCrossRepository --jq '"draft=\(.isDraft) fork=\(.isCrossRepository)"')
          echo "identity=$IDENTITY pr=#$PR before: $before"
          if gh pr ready "$PR" --undo; then result="converted"; else result="FAILED"; fi
          after=$(gh pr view "$PR" --json isDraft --jq '"draft=\(.isDraft)"')
          echo "after: $after result=$result"
          {
            echo "## Draft conversion test"
            echo
            echo "| Identity | PR | Before | After | Result |"
            echo "| --- | --- | --- | --- | --- |"
            echo "| $IDENTITY | #$PR | $before | $after | $result |"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$result" = converted ]
