# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj
#
# NOTE: GoReleaser handles binary builds and archives only.
# Docker image build/push and SLSA provenance attestation are managed by the
# ospo-reusable-workflows release workflow (see .github/workflows/release.yml).
# Container image signing is provided via actions/attest-build-provenance
# (Sigstore-backed SLSA attestation pushed to the registry) rather than
# standalone cosign signatures.

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: gemara-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/gemaraproj/gemara-mcp/internal/cli.Version={{ .Version }}
      - -X github.com/gemaraproj/gemara-mcp/internal/cli.Build={{ .ShortCommit }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats: ["tar.gz"]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  disable: true
